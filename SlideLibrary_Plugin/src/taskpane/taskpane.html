<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slide Library Plugin</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" type="text/css" />
</head>
<body>
    <div class="ms-welcome">
        <header class="header">
            <h2>Слайдотека</h2>
            <p class="subtitle">Экспорт презентации в корпоративный каталог</p>
        </header>

        <main class="main-content">
            <form id="export-form">
                <div class="ms-field">
                    <label for="title" class="ms-label">Название презентации <span class="required">*</span></label>
                    <input type="text" id="title" class="ms-input" placeholder="Например: Отчет Q3 по продажам" required />
                </div>

                <div class="ms-field">
                    <label for="description" class="ms-label">Описание</label>
                    <textarea id="description" class="ms-textarea" rows="3" placeholder="Краткое содержание или цели презентации..."></textarea>
                </div>

                <div class="ms-field">
                    <label for="tags" class="ms-label">Теги</label>
                    <input type="text" id="tags" class="ms-input" placeholder="продажи, отчет, q3 (через запятую)" />
                </div>

                <button type="submit" id="export-btn" class="ms-button-primary">Экспортировать</button>
            </form>

            <div id="status" class="status-box hidden">
                <p id="status-message"></p>
                <a id="result-link" href="#" target="_blank" class="hidden">Открыть в Google Drive ↗</a>
            </div>
        </main>
    </div>
</body>
</html>
