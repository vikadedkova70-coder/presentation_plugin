services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/slidoteka.db
    volumes:
      - ./data:/data          # здесь живёт SQLite — переживает перезапуск
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./addin-dist:/srv/addin:ro   # сюда Ольга кладёт собранный плагин (npm run build -> dist)
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
